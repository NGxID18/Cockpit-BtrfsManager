name: CI

on:
  push:
    branches: [main, Thesis]
  pull_request:
    branches: [main, Thesis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate shell scripts and manifest JSON
        run: |
          bash -n install.sh
          shellcheck --severity=warning install.sh
          python3 -m json.tool manifest.json > /dev/null

      - name: Validate JavaScript syntax and unit tests
        run: |
          node --check src/helper.js
          node --check src/engine.js
          node --check src/router.js
          node - <<'EOF'
          const fs = require("fs");
          const assert = require("assert");

          globalThis.window = globalThis;
          globalThis.document = {
            addEventListener: () => {},
            getElementById: () => null,
            querySelector: () => null,
            querySelectorAll: () => [],
            documentElement: { setAttribute: () => {}, classList: { toggle: () => {} } },
            body: { addEventListener: () => {} },
          };
          globalThis.localStorage = { getItem: () => "auto" };
          globalThis.addEventListener = () => {};
          globalThis.matchMedia = () => ({ addEventListener: () => {} });

          for (const file of ["src/helper.js", "src/engine.js", "src/router.js"]) {
            new Function(fs.readFileSync(file, "utf8"))();
          }

          assert.strictEqual(window.boxId("/"), "root");
          assert.strictEqual(window.boxId("/mnt/DATA"), "-mnt-DATA");
          assert.strictEqual(window.parseSize("2.5 GiB"), 2.5 * 1024 ** 3);
          assert.strictEqual(window.formatSize(1024 ** 3), "1.00 GiB");
          assert.strictEqual(window.escapeHtml("<script>\"'&"), "&lt;script&gt;&quot;&#39;&amp;");

          const p1 = window.Dropdown.parseLabel("DUP (Duplicate) - 2 redundant copies (Recommended, Min 1 drive) [Current]");
          assert.deepStrictEqual(p1, {
            title: "DUP (Duplicate)",
            desc: "2 redundant copies (Recommended, Min 1 drive)",
            isCurrent: true,
          });

          const p2 = window.Dropdown.parseLabel("/dev/sda (500.00 GiB - Available)");
          assert.deepStrictEqual(p2, {
            title: "/dev/sda",
            desc: "500.00 GiB - Available",
            isCurrent: false,
          });

          const p3 = window.Dropdown.parseLabel("Turn Off Automatic Backups");
          assert.deepStrictEqual(p3, {
            title: "Turn Off Automatic Backups",
            desc: "",
            isCurrent: false,
          });

          assert.strictEqual(window.Smart.parseJson("{}").supported, false);
          assert.strictEqual(window.Smart.parseJson("{}").level, "ok");

          const seagateUsb = window.Smart.parseJson(JSON.stringify({
            model_name: "ST1000LM035-1RK172",
            serial_number: "ZDEAK9N0",
            device: { type: "sat" },
            smart_status: { passed: true },
            ata_smart_attributes: {
              table: [
                { id: 5, name: "Reallocated_Sector_Ct", when_failed: "", raw: { value: 4040, string: "4040" } },
                { id: 7, name: "Seek_Error_Rate", when_failed: "", raw: { value: 25166974, string: "25166974" } },
                { id: 183, name: "Runtime_Bad_Block", when_failed: "", raw: { value: 12, string: "12" } },
                { id: 188, name: "Command_Timeout", when_failed: "", raw: { value: 133146345512, string: "133146345512" } },
                { id: 194, name: "Temperature_Celsius", when_failed: "", raw: { value: 39, string: "39 (0 20 0 0 0)" } },
                { id: 196, name: "Reallocated_Event_Count", when_failed: "", raw: { value: 4040, string: "4040" } },
                { id: 197, name: "Current_Pending_Sector", when_failed: "", raw: { value: 0, string: "0" } },
                { id: 198, name: "Offline_Uncorrectable", when_failed: "", raw: { value: 0, string: "0" } },
              ],
            },
          }));
          assert.strictEqual(seagateUsb.supported, true);
          assert.strictEqual(seagateUsb.level, "warn");
          assert.strictEqual(seagateUsb.totalBadSectors, 4040);
          assert.strictEqual(seagateUsb.summary, "4040 bad sectors");
          assert.strictEqual(seagateUsb.tempC, 39);

          const pendingDrive = window.Smart.parseJson(JSON.stringify({
            smart_status: { passed: true },
            ata_smart_attributes: {
              table: [{ id: 197, name: "Current_Pending_Sector", when_failed: "", raw: { value: 8, string: "8" } }],
            },
          }));
          assert.strictEqual(pendingDrive.level, "danger");

          const failedDrive = window.Smart.parseJson(JSON.stringify({
            smart_status: { passed: false },
          }));
          assert.strictEqual(failedDrive.level, "danger");

          const { execFileSync } = require("child_process");
          const pyOut = execFileSync("python3", ["-c", window.Sh.smartProbePy, "/dev/null", "/nonexistent"], {
            encoding: "utf8",
          });
          const pyParsed = JSON.parse(pyOut);
          assert.deepStrictEqual(pyParsed, { "/dev/null": {}, "/nonexistent": {} });

          console.log("JavaScript syntax and unit tests passed.");
          EOF

      - name: Run CSS, HTML, and Cockpit CSP static audit
        run: |
          python3 - <<'EOF'
          import pathlib
          import re

          css = pathlib.Path("style.css").read_text(encoding="utf-8")
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          js = "\n".join(
              p.read_text(encoding="utf-8")
              for p in sorted(pathlib.Path("src").glob("*.js"))
          )
          hay = html + "\n" + js

          clean_css = re.sub(r"/\*.*?\*/", "", css, flags=re.S)
          classes = set(
              re.findall(
                  r"\.([a-zA-Z_-][a-zA-Z0-9_-]*)",
                  re.sub(r"\{[^}]*\}", "", clean_css, flags=re.S),
              )
          )
          unused_cls = sorted(c for c in classes if c not in hay)
          vars_def = set(re.findall(r"(--[a-zA-Z0-9_-]+)\s*:", clean_css))
          unused_var = sorted(
              v
              for v in vars_def
              if len(re.findall(re.escape(v) + r"\b", clean_css)) <= 1 and v not in hay
          )
          html_ids = re.findall(r'id="([^"]+)"', html)
          unused_ids = [i for i in html_ids if js.count(i) == 0 and css.count(i) == 0]
          inline_styles = re.findall(r"style\s*=", hay)
          dom_style_muts = re.findall(r"\.style\.", hay)

          assert not unused_cls, f"Unused CSS classes: {unused_cls}"
          assert not unused_var, f"Unused CSS variables: {unused_var}"
          assert not unused_ids, f"Unused HTML IDs: {unused_ids}"
          assert not inline_styles, f"Inline style attributes found: {inline_styles}"
          assert not dom_style_muts, f"DOM .style mutations found: {dom_style_muts}"

          print("CSS, HTML, and CSP static audit passed.")
          EOF
